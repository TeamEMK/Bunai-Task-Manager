# ─────────────────────────────────────────────────────────────────────────
# Manual data sync — this is what the "Sync now" button on the Stock, Sales and
# Returns pages triggers, and a break-glass way to refresh the data by hand.
#
# THERE IS NO SCHEDULE HERE ON PURPOSE. The daily run belongs to the Railway
# cron service (see RAILWAY-CRON-SETUP.md), which runs this same script next to
# the database with no function timeout. Two schedules doing identical work
# would only double the API calls and leave it unclear which one filled a table.
#
# Trigger: the app's "Sync now" button (POST /api/sync/run dispatches this
# workflow), or the Actions tab → this workflow → "Run workflow".
#
# ── Setup (needed before the button does anything) ──
# Settings → Secrets and variables → Actions:
#     DB_HOST  DB_PORT  DB_USER  DB_PASSWORD  DB_NAME
#     UNI_TENANT  UNI_USERNAME  UNI_PASSWORD
#     VIN_BASE_URL  VIN_ORDER_API_KEY  VIN_ORDER_API_OWNER   (returns only)
# The same values the Railway cron service uses. Use the Railway PUBLIC host
# for DB_HOST (*.proxy.rlwy.net) — the private one is not reachable from here.
#
# These have never been set, so the button has never actually synced anything.
# ─────────────────────────────────────────────────────────────────────────
name: Sync now (manual)

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # One step, the same entry point Railway runs: schema, SKU master, stock,
      # orders, both sides of returns. Keeping it to a single command is the
      # point — the previous version called each sync script separately and so
      # never ran migrations, which is exactly how a missing column took the
      # returns step down on Railway's first run.
      - name: Sync everything
        run: node backend/scripts/daily-sync.js
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: 'true'
          UNI_TENANT: ${{ secrets.UNI_TENANT }}
          UNI_USERNAME: ${{ secrets.UNI_USERNAME }}
          UNI_PASSWORD: ${{ secrets.UNI_PASSWORD }}
          VIN_BASE_URL: ${{ secrets.VIN_BASE_URL }}
          VIN_ORDER_API_KEY: ${{ secrets.VIN_ORDER_API_KEY }}
          VIN_ORDER_API_OWNER: ${{ secrets.VIN_ORDER_API_OWNER }}

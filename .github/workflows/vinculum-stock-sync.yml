# ─────────────────────────────────────────────────────────────────────────
# Vinculum stock sync — keeps the Stock page fresh without an always-on server.
#
# Vercel functions freeze the moment they respond, so the six-minute stock sync
# can never finish there. GitHub Actions has no such limit: this job wakes up on
# a schedule, runs the same sync against the (Railway) database, then exits —
# free, and no extra hosting cost.
#
# ── One-time setup ──
# In the repo: Settings → Secrets and variables → Actions → New repository
# secret, and add each of these (values are the same ones the app uses):
#     DB_HOST  DB_PORT  DB_USER  DB_PASSWORD  DB_NAME
#     VIN_BASE_URL  VIN_API_KEY  VIN_API_OWNER  VIN_ORG_ID
#     VIN_ORDER_API_KEY  VIN_ORDER_API_OWNER   (for the order sync)
# Use the Railway PUBLIC host for DB_HOST (*.proxy.rlwy.net), not the internal one.
#
# Run it by hand any time from the Actions tab → this workflow → "Run workflow".
# ─────────────────────────────────────────────────────────────────────────
name: Vinculum sync (stock + orders)

on:
  schedule:
    - cron: '30 1 * * *'    # 07:00 IST (01:30 UTC) — every morning
  workflow_dispatch: {}      # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Sync stock from Vinculum into the database
        run: node backend/vinculum-sync.js sync
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          VIN_BASE_URL: ${{ secrets.VIN_BASE_URL }}
          VIN_API_KEY: ${{ secrets.VIN_API_KEY }}
          VIN_API_OWNER: ${{ secrets.VIN_API_OWNER }}
          VIN_ORG_ID: ${{ secrets.VIN_ORG_ID }}

      # Refresh the last 10 days of orders (new orders + status changes). The
      # order API caps each request at 7 days, so orders-sync walks it in
      # windows. Read-only: it never sends the acknowledge that would mark
      # orders processed.
      - name: Sync recent orders from Vin eRetail
        if: ${{ always() }}
        run: node backend/orders-sync.js sync 10
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          VIN_BASE_URL: ${{ secrets.VIN_BASE_URL }}
          VIN_ORDER_API_KEY: ${{ secrets.VIN_ORDER_API_KEY }}
          VIN_ORDER_API_OWNER: ${{ secrets.VIN_ORDER_API_OWNER }}

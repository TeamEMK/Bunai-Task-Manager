<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Bunai Task Manager</title>
<!-- Icons are cropped-and-resized from the logo, not the raw 718px file: the
     source has ~28% blank margin that would swallow a 16px tab icon.
     favicon.ico is listed first because browsers request /favicon.ico before
     they parse these tags. -->
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png"/>
<!-- ── PWA / iPhone Add-to-Home-Screen ── -->
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Task Manager"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="Task Manager"/>
<meta name="theme-color" content="#F8AFB1"/>
<link rel="manifest" href="/manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  /* ── Bunai brand tokens ──────────────────────────────
     brand      #F8AFB1  surfaces, fills, tints  (brand PDF)
     ink        #1B1B1B  text on brand surfaces  (brand PDF)
     brand-mid  #D9636A  borders / focus rings   (3.5:1 on white)
     brand-deep #A63F43  accent text on white    (6.2:1 on white)
     Pink is a light pastel, so it is ALWAYS a surface — never text
     on white, and never carries white text. Dark ink rides on top. */
  :root{
    --brand:#F8AFB1;
    --brand-soft:#FBC9CA;
    --brand-mid:#D9636A;
    --brand-deep:#A63F43;
    --ink:#1B1B1B;
    --brand-rgb:248,175,177;
    --brand-mid-rgb:217,99,106;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background: linear-gradient(135deg,#FFF6F6 0%,#FBD9DB 50%,#FCE9EA 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
  }

  /* ── Animated background circles ── */
  body::before, body::after {
    content:'';
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  body::before {
    width:400px;height:400px;
    top:-100px;left:-100px;
    background:radial-gradient(circle, #F8AFB155, transparent 70%);
    animation: bgFloat1 8s ease-in-out infinite;
  }
  body::after {
    width:300px;height:300px;
    bottom:-80px;right:-80px;
    background:radial-gradient(circle, #FBC9CA66, transparent 70%);
    animation: bgFloat2 10s ease-in-out infinite;
  }

  @keyframes bgFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,20px)} }
  @keyframes bgFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,-30px)} }

  /* ── Card ── */
  .login-wrap{
    background:#fff;
    border-radius:20px;
    padding:44px 40px;
    width:420px;
    box-shadow:0 20px 60px rgba(var(--brand-mid-rgb),.15), 0 4px 20px rgba(0,0,0,.08);
    position:relative;
    z-index:1;
    animation: cardIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.96); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* ── Logo section ── */
  .logo-section {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
  }

  .logo-img-wrap {
    position:relative;
    display:inline-block;
    animation: logoIn .8s ease .2s both;
  }
  @keyframes logoIn {
    from { opacity:0; transform:translateY(-20px) scale(.9); }
    to   { opacity:1; transform:translateY(0)     scale(1);  }
  }

  /* The Bunai mark is circular, so it gets a square box — the old 240x110
     wordmark slot would just letterbox it into 110px with dead space either side. */
  .logo-img-wrap img {
    width:160px;
    height:160px;
    border-radius:0;
    display:block;
    object-fit:contain;
    filter: drop-shadow(0 4px 16px rgba(var(--brand-mid-rgb),.3));
    animation: logoFloat 3.5s ease-in-out 1s infinite;
  }
  @keyframes logoFloat {
    0%,100% { transform:translateY(0px);   filter:drop-shadow(0 4px 16px rgba(217,99,106,.3)); }
    50%      { transform:translateY(-7px); filter:drop-shadow(0 12px 24px rgba(217,99,106,.45));  }
  }

  /* Placeholder mark — shown only until bunai-logo.png is dropped into public/.
     Mirrors the brand: dark script wordmark inside a thin pink ring. */
  .logo-fallback{
    display:none;
    width:150px;height:150px;
    align-items:center;justify-content:center;
    border:2px solid var(--brand);
    border-radius:50%;
    color:var(--ink);
    font-family:'Segoe Script','Brush Script MT',cursive;
    font-size:44px;
    font-weight:600;
    letter-spacing:1px;
    animation: logoFloat 3.5s ease-in-out 1s infinite;
  }

  /* Shimmer sweep over logo */
  .logo-img-wrap::after {
    content:'';
    position:absolute;
    top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(100deg, transparent 20%, rgba(255,255,255,.7) 50%, transparent 80%);
    animation: shimmer 2.5s ease .8s 2;
    pointer-events:none;
    border-radius:18px;
  }
  @keyframes shimmer {
    0%   { left:-100%; }
    100% { left:160%;  }
  }

  .logo-tagline {
    margin-top:14px;
    font-size:12px;
    font-weight:600;
    letter-spacing:3px;
    color:var(--brand-deep);
    text-transform:uppercase;
    animation: tagIn .5s ease .9s both;
  }
  @keyframes tagIn {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Decorative dots */
  .logo-dots {
    display:flex;gap:6px;margin-top:8px;
    animation: fadeIn .4s ease 1.2s both;
  }
  .logo-dots span {
    width:5px;height:5px;border-radius:50%;
    animation: dotPop .4s ease both;
  }
  .logo-dots span:nth-child(1){ background:var(--brand); animation-delay:1.2s; }
  .logo-dots span:nth-child(2){ background:var(--brand-mid); animation-delay:1.35s;}
  .logo-dots span:nth-child(3){ background:var(--ink); animation-delay:1.5s; }
  @keyframes dotPop {
    0%  { opacity:0; transform:scale(0); }
    70% { transform:scale(1.4); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* ── Form ── */
  h2{font-size:21px;font-weight:700;color:var(--ink);margin-bottom:4px;text-align:center;}
  p.sub{font-size:13px;color:#64748b;margin-bottom:24px;text-align:center;}

  .form-group{margin-bottom:16px;}
  label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}

  .input-wrap { position:relative; }
  .input-wrap .icon {
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    font-size:15px;color:#94a3b8;pointer-events:none;
  }

  /* ── Show / hide password ────────────────────────────
     Sits inside the field on the right; the input gets matching right padding
     so long passwords never run underneath it. */
  .input-wrap.has-toggle input{ padding-right:44px; }
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    display:grid;place-items:center;
    width:32px;height:32px;padding:0;
    background:none;border:none;border-radius:8px;
    color:#94a3b8;cursor:pointer;
    transition:color .15s, background .15s;
  }
  .pw-toggle:hover{ color:var(--brand-deep); background:rgba(var(--brand-rgb),.25); }
  .pw-toggle:focus-visible{
    outline:2px solid var(--brand-mid);
    outline-offset:1px;
    color:var(--brand-deep);
  }
  .pw-toggle svg{ width:18px;height:18px;display:block; }
  /* Closed eye means "currently hidden, click to reveal"; they swap on toggle. */
  .pw-toggle .pw-icon-off{ display:none; }
  .pw-toggle.is-on .pw-icon-on{ display:none; }
  .pw-toggle.is-on .pw-icon-off{ display:block; }
  input{
    width:100%;
    padding:11px 14px 11px 38px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border .2s, box-shadow .2s;
    color:var(--ink);
    background:#fafafa;
  }
  input:focus{
    border-color:var(--brand-mid);
    box-shadow:0 0 0 3px rgba(var(--brand-rgb),.4);
    background:#fff;
  }

  .btn-login{
    width:100%;
    padding:13px;
    background:linear-gradient(135deg,var(--brand-soft),var(--brand));
    color:var(--ink);
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:all .2s;
    margin-top:6px;
    letter-spacing:.3px;
    box-shadow:0 4px 16px rgba(var(--brand-mid-rgb),.35);
  }
  .btn-login:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(var(--brand-mid-rgb),.45);
  }
  .btn-login:active{ transform:translateY(0); }

  .error{
    background:#fef2f2;border:1px solid #fecaca;
    color:#dc2626;padding:10px 14px;
    border-radius:8px;font-size:13px;
    margin-bottom:14px;display:none;
  }

  /* ── Divider ── */
  .divider {
    display:flex;align-items:center;gap:10px;
    margin:20px 0 16px;
  }
  .divider::before,.divider::after {
    content:'';flex:1;height:1px;background:#e2e8f0;
  }
  .divider span { font-size:11px;color:#94a3b8;white-space:nowrap; }

  /* ── Footer ── */
  .footer-text {
    text-align:center;
    font-size:11px;
    color:#94a3b8;
    margin-top:20px;
  }
  .footer-text strong { color:var(--brand-deep); }
</style>
</head>
<body>

<div class="login-wrap">

  <!-- Logo -->
  <div class="logo-section">
    <div class="logo-img-wrap">
      <img src="bunai-logo.png" alt="Bunai Logo"
           onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='flex'"/>
      <!-- Fallback if image not found -->
      <div id="fallbackLogo" class="logo-fallback">Bunai</div>
    </div>
    <div class="logo-tagline">Task Manager</div>
    <div class="logo-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Form -->
  <h2>Welcome back 👋</h2>
  <p class="sub">Sign in to your account</p>

  <div class="error" id="err"></div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="icon">✉</span>
      <input type="email" id="email" placeholder="Enter your email"/>
    </div>
  </div>

  <div class="form-group">
    <label>Password</label>
    <div class="input-wrap has-toggle">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="Enter your password"
             onkeydown="if(event.key==='Enter')login()"/>
      <button type="button" class="pw-toggle" id="pwToggle"
              aria-label="Show password" aria-pressed="false"
              onclick="togglePassword(event)">
        <svg class="pw-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="pw-icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn-login" onclick="login()">Sign In →</button>

  <div class="footer-text">
    <strong>Bunai Task Manager</strong> &nbsp;·&nbsp; Grow Your Business
  </div>
</div>

<script>
function togglePassword(ev){
  const input = document.getElementById('password');
  const btn   = document.getElementById('pwToggle');
  const show  = input.type === 'password';

  input.type = show ? 'text' : 'password';
  btn.classList.toggle('is-on', show);
  btn.setAttribute('aria-pressed', String(show));
  btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');

  // Mouse click: hand focus back to the field with the caret at the end so the
  // user can keep typing. Keyboard activation reports detail === 0 — there we
  // leave focus on the button, otherwise Tab users get thrown out of the toggle
  // the moment they press it.
  if (ev && ev.detail !== 0) {
    const end = input.value.length;
    input.focus();
    try { input.setSelectionRange(end, end); } catch(_) {}
  }
}

// Already signed in — go straight to /app
(async function checkExistingSession() {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) { window.location.replace('/app'); }
  } catch(e) {}
})();

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!email||!password){err.textContent='Please fill all fields';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Login failed';err.style.display='block';return;}
    // Also keep the token in localStorage as a fallback (in case cookies are blocked)
    if(d.token) localStorage.setItem('authToken', d.token);
    window.location.replace('/app');
  }catch(e){err.textContent='Server error. Try again.';err.style.display='block';}
}
</script>
</body>
</html>
